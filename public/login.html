<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — FlexShop Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 font-size=%2280%22><text y=%220.9em%22>🖨️</text></svg>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/login.css">
<script src="/login.js" defer></script>
</head>
<body>
<main class="auth-shell">
 <section class="brand-panel"><div class="brand-mark">🖨️</div><div>
  <div class="eyebrow">FLEX PRINTING BUSINESS SUITE</div>
  <h1>FlexShop<br>Manager</h1>
  <p>One place for invoices, customers, inventory, jobs and reports.</p>
 </div><div class="footnote">Private admin dashboard · Secure PostgreSQL storage</div></section>
 <section class="form-panel">
  <div class="form-card"><div class="small-tag">ADMIN ACCESS</div>
   <h2>Welcome back</h2>
   <p class="help">Sign in to manage your FlexShop business.</p>
   <form id="loginForm" autocomplete="on">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" placeholder="admin@example.com" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="Your admin password" autocomplete="current-password" required>
    <p role="alert" class="error" id="loginError" aria-live="polite"></p>
    <button type="submit" id="loginButton">Sign in</button>
   </form>
   <p class="privacy">Your data remains in your connected PostgreSQL database.</p>
  </div>
 </section>
</main>
</body>
</html>
